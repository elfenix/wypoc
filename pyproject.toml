[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wypoc"
version = "0.1.0"
description = "Proof-of-concept PEG grammar, parser, and tree-walking interpreter for the wyrm language"
requires-python = ">=3.10"
dependencies = [
    "pegen==0.3.0",
    # ~/.wyrm/config (see wypoc/config.py). tomlkit rather than tomllib
    # because the file is written as well as read, and a round-tripping
    # editor keeps the comments and layout a person put in it.
    "tomlkit>=0.13",
]

[project.optional-dependencies]
lsp = ["pygls>=2.1,<3"]
repl = ["rich>=13", "textual>=0.80"]
dbus = ["dbus-fast>=2.0"]
nng = ["pynng>=0.8"]
dev = ["pytest>=8", "rich>=13", "textual>=0.80", "dbus-fast>=2.0", "pynng>=0.8"]

[project.scripts]
wyrm = "wypoc.cli:main"
wyrm-lsp = "wypoc.lsp:main"
wyrm-dap = "wypoc.dap.server:main"

[tool.setuptools]
packages = ["wypoc", "wypoc.dap", "wypoc.compiler_bc", "wypoc.vm"]

[tool.setuptools.package-data]
wypoc = ["*.gram", "corelib/**/*.wy"]
"wypoc.compiler_bc" = ["include/wyrm/*.h"]

[tool.pytest.ini_options]
testpaths = ["test"]

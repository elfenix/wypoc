[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wypoc"
version = "0.1.0"
description = "Proof-of-concept PEG grammar, parser, and tree-walking interpreter for the wyrm language"
requires-python = ">=3.10"
dependencies = [
    "pegen==0.3.0",
]

[project.optional-dependencies]
lsp = ["pygls>=2.1,<3"]
repl = ["rich>=13", "textual>=0.80"]
dev = ["pytest>=8", "rich>=13", "textual>=0.80"]

[project.scripts]
wyrm = "wypoc.cli:main"
wyrm-lsp = "wypoc.lsp:main"

[tool.setuptools]
# `wypoc.compiler_c` is a package of its own, so it needs listing here too -
# an editable install papers over its absence, a real one does not.
packages = ["wypoc", "wypoc.compiler_c"]

[tool.setuptools.package-data]
wypoc = ["*.gram", "corelib/**/*.wy"]

[tool.pytest.ini_options]
testpaths = ["test"]

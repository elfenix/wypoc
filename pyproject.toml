[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wypoc"
version = "0.1.0"
description = "Proof-of-concept PEG grammar, parser, and tree-walking interpreter for the wyrm language"
requires-python = ">=3.10"
dependencies = [
    "pegen==0.3.0",
]

[project.optional-dependencies]
lsp = ["pygls>=2.1,<3"]

[project.scripts]
wyrm = "wypoc.cli:main"
wyrm-lsp = "wypoc.lsp:main"

[tool.setuptools]
packages = ["wypoc"]

[tool.setuptools.package-data]
wypoc = ["*.gram"]
